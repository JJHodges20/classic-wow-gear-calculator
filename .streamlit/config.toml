# Streamlit settings for the Classic Gear Calculator. Streamlit reads this file from the
# directory it starts in; `wowgear ui` starts in the project root.

[client]
# A local tool: no Deploy button, no developer menu.
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
# Never send usage statistics to Streamlit.
gatherUsageStats = false

[server]
# Imports are refused above 5 MB anyway; do not accept more.
maxUploadSize = 5

[theme]
# One sans-serif family throughout (bundled with Streamlit: nothing is fetched), on a type
# scale that keeps data dense but readable. Corners, borders and charts are set here so
# Streamlit's own widgets match the app's custom elements (components/theme.py).
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseFontSize = 15
headingFontSizes = ["1.75rem", "1.2rem", "1.05rem", "0.95rem", "0.9rem", "0.85rem"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
linkUnderline = false

# Light (primary): a warm neutral page with white surfaces, charcoal text, one gold accent
# for what is selected or recommended, navy for links and information. Green and red are
# kept for beneficial and harmful differences.
[theme.light]
primaryColor = "#8F6516"
backgroundColor = "#F6F4EF"
secondaryBackgroundColor = "#EFEBE3"
textColor = "#1C2430"
borderColor = "#DDD6C8"
dataframeBorderColor = "#E6E0D4"
dataframeHeaderBackgroundColor = "#F3F0E9"
linkColor = "#23426E"
greenColor = "#2E7D4F"
redColor = "#B3261E"
blueColor = "#23426E"
orangeColor = "#A35A12"
yellowColor = "#8F6516"
grayColor = "#646B78"
chartCategoricalColors = ["#B08A3E", "#23426E", "#2E7D4F", "#A35A12", "#6B5B95", "#646B78"]

[theme.dark]
primaryColor = "#D2A54E"
backgroundColor = "#0E131B"
secondaryBackgroundColor = "#1B2433"
textColor = "#E8E4DA"
borderColor = "#283244"
dataframeBorderColor = "#232D3D"
dataframeHeaderBackgroundColor = "#182131"
linkColor = "#9CB8E4"
greenColor = "#5DBB86"
redColor = "#EE6A60"
blueColor = "#7FA3DB"
orangeColor = "#E39A4F"
yellowColor = "#D2A54E"
grayColor = "#8F98A6"
chartCategoricalColors = ["#D2A54E", "#7FA3DB", "#5DBB86", "#E39A4F", "#B39DDB", "#8F98A6"]
