conversions:
  level: 60
  note: >-
    Level-60 values. At other levels crit and dodge per Agility and spell crit per Intellect
    differ, and the calculator says its conversions are approximate there. Conflicts between
    sources are noted on the values they affect; docs/research/STAT_CONVERSIONS.md has them all.
  sources: [wowwiki_attack_power_2006, wowwiki_ranged_attack_power_2006, wowwiki_strength_2006, wowwiki_crit_formulas_2006, wowhead_classic_stats, vmangos_stat_system]
  by_class:
    warrior:
      strength->attack_power: {per_point: 2}
      agility->ranged_attack_power: {per_point: 1, note: "1 per Agility (Wowhead, VMaNGOS); two 2006 wiki pages give 2."}
      agility->crit: {points_per_unit: 20}
      agility->dodge: {points_per_unit: 20}
      agility->armor: {per_point: 2}
      strength->block_value: {points_per_unit: 20, note: "Wowhead: 1 per 20 Strength. VMaNGOS subtracts 1 from the total, which does not change what an item adds."}
    paladin:
      strength->attack_power: {per_point: 2}
      agility->crit: {points_per_unit: 20, note: "Wowhead and the 2006 wiki give 20; VMaNGOS's tables give 19.76."}
      agility->dodge: {points_per_unit: 19.767}
      agility->armor: {per_point: 2}
      strength->block_value: {points_per_unit: 20}
      intellect->spell_crit: {points_per_unit: 54, note: "Wowhead's value. VMaNGOS gives 53.77; other sources 29.5 or 59.9. Unresolved."}
    hunter:
      strength->attack_power: {per_point: 1}
      agility->attack_power: {per_point: 1}
      agility->ranged_attack_power: {per_point: 2}
      agility->crit: {points_per_unit: 53, note: "Blizzard (quoted by the 2006 wiki): 53 Agility per 1%."}
      agility->dodge: {points_per_unit: 26.5}
      agility->armor: {per_point: 2}
    rogue:
      strength->attack_power: {per_point: 1}
      agility->attack_power: {per_point: 1}
      agility->ranged_attack_power: {per_point: 1}
      agility->crit: {points_per_unit: 29, note: "Blizzard (quoted by the 2006 wiki): 29 Agility per 1%."}
      agility->dodge: {points_per_unit: 14.5}
      agility->armor: {per_point: 2}
    priest:
      strength->attack_power: {per_point: 1}
      agility->crit: {points_per_unit: 20}
      agility->dodge: {points_per_unit: 20}
      agility->armor: {per_point: 2}
      intellect->spell_crit: {points_per_unit: 59.2}
    shaman:
      strength->attack_power: {per_point: 2}
      agility->crit: {points_per_unit: 20, note: "Wowhead and the 2006 wiki give 20; VMaNGOS's tables give 19.69."}
      agility->dodge: {points_per_unit: 19.697}
      agility->armor: {per_point: 2}
      strength->block_value: {points_per_unit: 20}
      intellect->spell_crit: {points_per_unit: 59.5}
    mage:
      strength->attack_power: {per_point: 1}
      agility->armor: {per_point: 2}
      intellect->spell_crit: {points_per_unit: 59.5}
    warlock:
      strength->attack_power: {per_point: 1}
      agility->crit: {points_per_unit: 20}
      agility->armor: {per_point: 2}
      intellect->spell_crit: {points_per_unit: 60.6}
    druid:
      strength->attack_power: {per_point: 2}
      agility->attack_power: {per_point: 1, note: "In Cat Form only (patch 1.7.0: each point of Agility adds 1 attack power)."}
      agility->crit: {points_per_unit: 20}
      agility->dodge: {points_per_unit: 20}
      agility->armor: {per_point: 2}
      intellect->spell_crit: {points_per_unit: 60}

caps:
  melee_hit:
    kind: melee_miss
    stat: hit
    label: Melee hit cap
    description: >-
      Hit from gear that removes special-attack misses: the target's miss chance plus the hit
      that is suppressed when the target's defense exceeds weapon skill by more than 10.
    sources: [magey_attack_table, wowwiki_miss_2006, marrow_mechanics]
  dual_wield_hit:
    kind: dual_wield_miss
    stat: hit
    label: Dual-wield hit cap
    description: >-
      Hit from gear that removes white-hit misses while dual wielding: the melee cap plus the
      dual-wield penalty.
    sources: [magey_attack_table]
  ranged_hit:
    kind: ranged_miss
    stat: hit
    label: Ranged hit cap
    description: Hit from gear that removes ranged misses; ranged attacks use the melee formula.
    sources: [wowwiki_miss_2006, magey_attack_table]
  spell_hit:
    kind: spell_miss
    stat: spell_hit
    label: Spell hit cap
    description: Spell hit from gear that lifts the chance to hit to its 99% maximum.
    sources: [wowwiki_resistance_2006, blizzard_resistances_2006, wowwiki_crit_2006]
  crit_immunity_defense:
    kind: defense_crit_immunity
    stat: defense
    label: Crit immunity
    description: >-
      Defense from gear that removes the target's chance to land a critical strike on you;
      440 total defense against a level 63 boss.
    sources: [wowwiki_defense_2006, wiki_defense]

mechanics:
  melee_miss:
    base_miss: 5.0
    small_gap_limit: 10
    per_point_small_gap: 0.1
    per_point_large_gap: 0.2
    suppression_per_point_beyond_limit: 0.2
    dual_wield_penalty: 19.0
    skill_per_level: 5
    sources: [magey_attack_table, wowwiki_miss_2006, marrow_mechanics]
  spell_miss:
    hit_chance_by_level_gap: {0: 96.0, 1: 95.0, 2: 94.0, 3: 83.0}
    per_level_beyond_table: 11.0
    max_hit_chance: 99.0
    sources: [wowwiki_resistance_2006, blizzard_resistances_2006, wowwiki_crit_2006]
  defense:
    base_crit_chance: 5.0
    crit_change_per_skill_point: 0.04
    skill_per_level: 5
    sources: [wowwiki_defense_2006, wiki_defense]

assumptions:
  - >-
    Melee hit suppression between 301 and 304 weapon skill follows the magey wiki: (defense
    gap - 10) x 0.2%. The Marrow compendium adds a flat 1% instead. Both give 1% at 300 skill
    and none at 305.
  - Ranged attacks are assumed to suffer the same hit suppression as melee; no direct test was found.
  - >-
    The dual-wield white-hit penalty is the flat 19% measured in 2021 (a 28% cap at 300 skill).
    An older formula, 0.8 x miss + 20%, gives 26.4% miss instead of 27%.
  - A character's base weapon skill and defense are level x 5, as if trained to the maximum.
  - Dungeon targets default to two levels above the character; leveling, solo and PvP targets to the character's own level.
  - >-
    Hunters may use thrown weapons (warcraft.wiki.gg says hunters knew Throw until patch 4.0.1;
    one Classic guide leaves it out).
  - >-
    Eligibility does not check talents or trainer levels other than plate and mail at 40 and
    dual wield: shaman two-handed axes and maces need the Enhancement talent, polearms need level 20.
  - The base crit chance of an equal-level attacker (5%) is derived from the 440-defense breakpoint and 0.04% per defense point.
  - Item stats follow patch 1.12, as Classic Era does; the Era client (1.15) may differ for a few items.

