# Classic Era: the original World of Warcraft Classic rules (patch 1.12 basis) as played on
# Blizzard's Classic Era realms. Every block cites its sources (listed at the end); the
# research notes behind them are in docs/research/. Change a value only with a source, and
# bump the version when anything changes: stored results name the version they used.

id: classic_era
version: 1.0.0
label: Classic Era
game_family: classic
rules_basis: Patch 1.12 (Classic was "based on patch 1.12.0, ported to a modern infrastructure")
summary: >-
  The original World of Warcraft Classic: level 60, six content phases from Molten Core to
  Naxxramas, all of them open on Classic Era realms.
min_level: 1
max_level: 60
max_target_level: 63
default_phase: 6
validation_status: draft

phases:
  - number: 1
    label: Phase 1
    content: Molten Core, Onyxia's Lair and Maraudon, with the launch dungeons (August 2019)
    sources: [wiki_classic]
  - number: 2
    label: Phase 2
    content: Dire Maul, Azuregos and Lord Kazzak, the honor system and PvP rank rewards (November 2019)
    sources: [wiki_classic]
  - number: 3
    label: Phase 3
    content: Blackwing Lair, the Darkmoon Faire, Alterac Valley and Warsong Gulch (February 2020)
    sources: [wiki_classic]
  - number: 4
    label: Phase 4
    content: Zul'Gurub, the green dragons and Arathi Basin (March 2020)
    sources: [wiki_classic]
  - number: 5
    label: Phase 5
    content: The Ahn'Qiraj raids, Tier 0.5 dungeon gear and relics (July 2020)
    sources: [wiki_classic]
  - number: 6
    label: Phase 6
    content: Naxxramas, the Scourge Invasion and world PvP objectives (December 2020)
    sources: [wiki_classic]

content_modes:
  - mode: raid_pve
    label: Raid
    target_level_offset: 3
    note: Raid bosses count as three levels above the player - level 63 against a level 60.
    sources: [wiki_boss, magey_attack_table]
  - mode: dungeon_pve
    label: Dungeon
    target_level_offset: 2
    note: >-
      End-game dungeon bosses range from the player's level to three above; two above is an
      assumption in the middle. Set the target level to override it.
    sources: [wiki_boss]
  - mode: leveling
    label: Leveling
    target_level_offset: 0
    note: Assumes enemies of the character's own level. Set the target level to override it.
    sources: [wowwiki_miss_2006]
  - mode: solo
    label: Solo
    target_level_offset: 0
    note: Assumes enemies of the character's own level. Set the target level to override it.
    sources: [wowwiki_miss_2006]
  - mode: pvp
    label: PvP
    target_level_offset: 0
    note: Assumes opponents of the character's own level.
    sources: [wowwiki_resistance_2006]

