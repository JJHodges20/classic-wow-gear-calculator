id: paladin_tank_prot
version: 1.0.0
label: Protection (survival only)
class_name: paladin
role: tank
specialization: Protection
summary: 'A shield-tanking paladin, valued in tank points for survival only. No 1.12 source gives
  paladin weights: this experimental profile borrows a warrior tank''s values.'
