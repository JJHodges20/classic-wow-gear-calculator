assumptions:
- 'No 1.12 source gives Protection paladin weights: these are a warrior tank''s survival values (Undertanker),
  an assumption for a paladin.'
- Threat - spell damage, holy damage, hit - is not valued in this experimental profile.
- 'Icy Veins'' priority, for comparison: Stamina, then Defense, Strength, Agility, armor, Intellect.'
proc_assumptions:
- Procs and on-use effects are not valued.
set_bonus_rules:
- Set bonuses are not valued in version 1.
