# Holy (pre-raid dungeons) - see configs/profiles/README.md for the format and
# docs/research/STAT_WEIGHTS.md for where each number comes from.
id: paladin_healer_pre_raid
version: 1.0.0
label: Holy (pre-raid dungeons)
class_name: paladin
role: healer
specialization: Holy
summary: 'A healing paladin gearing in dungeons before raids, where mana runs short: more value on
  Intellect and mana per 5.'
ruleset: classic_era
target_level: 60
default_content_mode: dungeon_pve
score_unit: healing equivalents (+heal)
validation_status: draft
stat_weights:
- stat: healing_power
  weight: 1.0
  basis: derived
  note: The score unit.
- stat: spell_power
  weight: 1.0
  basis: derived
  note: Damage-and-healing spell power counts fully as healing.
- stat: intellect
  weight: 1.5
  basis: sourced
  sources:
  - xcellers_holy
  note: The source's pre-raid value, including Intellect's crit.
- stat: spell_crit
  weight: 15.0
  basis: sourced
  sources:
  - xcellers_holy
  note: The source's pre-raid value.
- stat: mp5
  weight: 4.0
  basis: sourced
  sources:
  - xcellers_holy
  note: The source's pre-raid value.
assumptions:
- The source's values for gear before raids, when mana is the limit.
- Spirit is not valued.
proc_assumptions:
- Procs and on-use effects are not valued.
set_bonus_rules:
- Set bonuses are not valued in version 1.
sources:
- id: xcellers_holy
  title: 'Xcellers: Holy paladin stat values spreadsheet (2020)'
  url: https://docs.google.com/spreadsheets/d/1lSZzNVHKsvG13WRnDuqbAZyQ47ktVytB3Z2CbW7XHdA
  retrieved: '2026-10-07'
  note: Intellect 1, crit 12, MP5 2 in healing; before raids 1.5, 15, 4. Judgment-based.
