# Arms (two-hander) - see configs/profiles/README.md for the format and
# docs/research/STAT_WEIGHTS.md for where each number comes from.
id: warrior_dps_arms
version: 1.0.0
label: Arms (two-hander)
class_name: warrior
role: melee_dps
specialization: Arms
summary: A two-handed Arms warrior in raids, valued in attack power. No 1.12 source gives Arms weights,
  so this experimental profile applies the Fury sources' values to a two-hander.
ruleset: classic_era
target_level: 60
default_content_mode: raid_pve
score_unit: attack power equivalents (AP)
validation_status: experimental
stat_weights:
- stat: attack_power
  weight: 1.0
  basis: derived
  note: The score unit.
- stat: crit
  weight: 20.0
  basis: assumption
  sources:
  - su_fury_ep
  - twinstar_fury_weights
  note: 'The Fury sources'' 20 AP per 1% crit, applied to a two-hander: no Arms value from 1.12 was
    found.'
- stat: hit
  weight: 20.0
  basis: assumption
  sources:
  - su_fury_ep
  - twinstar_fury_weights
  note: The Fury sources' 20 AP per 1% hit, applied to a two-hander.
- stat: melee_weapon_dps
  weight: 14.0
  basis: mechanic
  sources:
  - icy_veins_fury
  note: 14 attack power = 1 weapon damage per second.
derived_stats:
- source: strength
  target: attack_power
- source: agility
  target: crit
hard_caps:
- stat: hit
  cap:
    ruleset_cap: melee_hit
  note: 'One weapon has no dual-wield penalty: past this cap hit is worth nothing.'
weapon_preferences:
  preferred_types:
  - two_handed_sword
  - two_handed_axe
  - two_handed_mace
  - polearm
  note: Speed and the damage range matter for Mortal Strike; version 1 values only damage per second.
assumptions:
- 'No 1.12 source gives Arms stat weights: the crit and hit values are the Fury sources'' and are
  assumptions here.'
- Weapon skill is not valued (weight 0); it lowers the hit cap, which version 2 will model.
proc_assumptions:
- Procs and on-use effects are not valued.
set_bonus_rules:
- Set bonuses are not valued in version 1.
sources:
- id: su_fury_ep
  title: 'Sixty Upgrades: Fury EP preset (Classic Era gear planner)'
  url: https://sixtyupgrades.com/
  retrieved: '2026-10-07'
  note: Crit 20, hit 20, Strength 2, Agility 1, weapon DPS 14.
- id: twinstar_fury_weights
  title: 'Twinstar forum: DPS warrior stat weights (vido, 2016)'
  url: https://forum.twinstar.cz/threads/dps-warrior-stat-weights.112557/
  retrieved: '2026-10-07'
- id: icy_veins_fury
  title: 'Icy Veins: Fury Warrior DPS stat priority (WoW Classic, November 2024)'
  url: https://www.icy-veins.com/wow-classic/fury-warrior-dps-pve-stat-priority
  retrieved: '2026-10-07'
  note: 'States the attack power rule: 14 attack power = 1 weapon damage per second.'
