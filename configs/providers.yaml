# Item data providers, in the order the item search service consults them (roadmap section 7).
#
# Secrets are never written here. A provider lists the names of the environment variables
# that hold its credentials; they are read from the environment or from .env.
#
# status:
#   active          implemented and used
#   planned         described by the roadmap, not implemented yet
#   reference_only  a human reference; the app links to it and never fetches from it

providers:
  - id: bundled
    kind: bundled_dataset
    priority: 1
    enabled: true
    status: active
    description: >-
      Curated Classic Era item dataset shipped with the app (data/bundled, built from the
      VMaNGOS world database); the offline baseline.

  - id: warcraft_logs
    kind: warcraft_logs
    priority: 2
    enabled: false
    status: planned
    description: >-
      Warcraft Logs API v2 (OAuth 2.0). Its game-data items have only an id, a name and an
      icon - no stats - so it cannot supply items; kept for log validation in version 5.
    secrets: [WOWGEAR_WCL_CLIENT_ID, WOWGEAR_WCL_CLIENT_SECRET]

  - id: blizzard
    kind: blizzard_game_data
    priority: 3
    enabled: true
    status: active
    description: >-
      Blizzard Battle.net Game Data API, Classic Era namespace (OAuth 2.0 client
      credentials). Lookups are cached for at most 30 days, as its terms require.
    secrets: [WOWGEAR_BLIZZARD_CLIENT_ID, WOWGEAR_BLIZZARD_CLIENT_SECRET]
    settings:
      region: us
      locale: en_US
      timeout_seconds: 10

  - id: file_import
    kind: file_import
    priority: 4
    enabled: true
    status: active
    description: Items you import from CSV or JSON files, kept as your own items.

  - id: wowhead
    kind: reference_only
    priority: 99
    enabled: false
    status: reference_only
    description: Wowhead Classic database, a human reference. Never fetched or scraped.
