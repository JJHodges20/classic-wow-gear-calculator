[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "classic-wow-gear-calculator"
version = "0.1.0"
description = "Local-first World of Warcraft Classic gear build calculator: explainable, profile-aware item comparisons."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Joshua Hodges" }]
dependencies = [
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "httpx>=0.28",
    "streamlit>=1.50",
    "plotly>=6.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "playwright>=1.45",
]

[project.scripts]
wowgear = "wow_gear.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wow_gear = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# apps/streamlit_app first, so the app's own packages (components, state, pages) win.
pythonpath = ["apps/streamlit_app", "src", "."]
addopts = "-ra --strict-markers -m 'not network'"
markers = [
    "network: calls a live external service; deselected by default (run with -m network)",
]
# A warning is a defect nobody has looked at yet. Add a targeted ignore here, with a reason,
# only for warnings raised inside third-party code.
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "apps/streamlit_app", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["wow_gear"]
plugins = ["pydantic.mypy"]
